<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>The Long Dark maps by henhau</title>
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="6"/></clipPath>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
    </filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#171717"/>
    <rect width="64" height="64" filter="url(#grain)" opacity=".62"/>
  </g>
  <!-- Same Lucide compass used for the world map link. -->
  <g transform="translate(8 8) scale(2)" stroke="#eee9db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/>
  </g>
</svg>
