services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL:-https://tld.henhau.online}
    restart: unless-stopped
    init: true
    environment:
      APP_ORIGIN: ${SITE_URL:-https://tld.henhau.online}
      SITE_URL: ${SITE_URL:-https://tld.henhau.online}
      TLD_DATA_DIR: /data
      TRUST_PROXY: 'true'
    expose:
      - '3000'
    volumes:
      - atlas-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const r = await fetch('http://127.0.0.1:3000/healthz'); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    stop_grace_period: 15s

volumes:
  atlas-data:
